[pytest]
# Test roots for both downstream (finsaferag) and upstream (FedE) suites.
testpaths =
    finsaferag/tests
    FedE/tests

# Register custom markers to avoid warnings.
markers =
    slow: downloads real MedCPT weights from HF (~400MB). Skipped by default; run with -m slow.

# Nice defaults.
addopts = -ra --strict-markers
