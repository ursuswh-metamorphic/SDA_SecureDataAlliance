# Experiment Configuration Schema for FedE P3 Clean Benchmark
model:
  name: "BAAI/bge-base-en-v1.5"
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

data:
  corpus: "../artifacts/data/corpus_v1.jsonl"
  train_data: "selected_data_clean.json"
  company_map: "tools/company_map.json"
  val_queries: "../artifacts/data/queries_val_v1.jsonl"
  val_qrels: "../artifacts/data/qrels_val_v1.tsv"

training:
  learning_rate: 1e-5
  batch_size: 16
  num_rounds: 10
  num_epochs: 1
  num_steps: 50
  temperature: 0.05
  kd_weight: 1.0

federated:
  num_clients: 5
  partitioner: "CompanyPartitioner"

dp:
  enabled: false
  target_epsilon: 20.0
  target_delta: 1e-5
  clip_norm: 0.1
